<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slab Scanner - Graded Card Processor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container-fluid py-4">
        <h1 class="mb-4">Slab Scanner</h1>

        <!-- Upload Section -->
        <div id="uploadSection" class="row mb-5">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h5 class="mb-0">Front Photo</h5>
                    </div>
                    <div class="card-body">
                        <div id="frontDropZone" class="drop-zone">
                            <img id="frontImage" class="drop-zone-thumb" alt="Front preview">
                            <div class="drop-zone-content">
                                <p class="drop-zone-prompt">Drag and drop front photo here</p>
                                <input type="file" id="frontInput" accept="image/*" style="display:none;">
                                <button class="btn btn-outline-primary btn-sm" onclick="document.getElementById('frontInput').click()">Choose Image</button>
                                <button class="btn btn-sm btn-link text-danger drop-zone-clear" onclick="clearImage('front')">Clear</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h5 class="mb-0">Back Photo</h5>
                    </div>
                    <div class="card-body">
                        <div id="backDropZone" class="drop-zone">
                            <img id="backImage" class="drop-zone-thumb" alt="Back preview">
                            <div class="drop-zone-content">
                                <p class="drop-zone-prompt">Drag and drop back photo here</p>
                                <input type="file" id="backInput" accept="image/*" style="display:none;">
                                <button class="btn btn-outline-primary btn-sm" onclick="document.getElementById('backInput').click()">Choose Image</button>
                                <button class="btn btn-sm btn-link text-danger drop-zone-clear" onclick="clearImage('back')">Clear</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Processing Section -->
        <div class="row mb-5" id="processingSection" style="display:none;">
            <div class="col-12">
                <div class="card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h5 class="mb-0">Card Outlines</h5>
                        <small class="text-muted">Click-drag corner-to-corner to draw a rectangle, then drag any corner to rotate or fine-tune.</small>
                    </div>
                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-6">
                                <div class="d-flex justify-content-between align-items-center mb-2">
                                    <h6 class="mb-0">Front</h6>
                                    <button class="btn btn-sm btn-outline-secondary" onclick="clearQuad('front')">Clear rectangle</button>
                                </div>
                                <div id="frontCanvasContainer" class="canvas-container">
                                    <canvas id="frontCanvas"></canvas>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="d-flex justify-content-between align-items-center mb-2">
                                    <h6 class="mb-0">Back</h6>
                                    <div>
                                        <button class="btn btn-sm btn-outline-primary" onclick="copyQuadFromFront()">Copy from front</button>
                                        <button class="btn btn-sm btn-outline-secondary" onclick="clearQuad('back')">Clear rectangle</button>
                                    </div>
                                </div>
                                <div id="backCanvasContainer" class="canvas-container">
                                    <canvas id="backCanvas"></canvas>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Export Section -->
        <div class="row" id="exportSection" style="display:none;">
            <div class="col-12">
                <div class="card">
                    <div class="card-header">
                        <h5>Export</h5>
                    </div>
                    <div class="card-body">
                        <div class="mb-3">
                            <label for="exportName" class="form-label">Card Name/ID:</label>
                            <input type="text" id="exportName" class="form-control" placeholder="e.g., PSA-001, Base-Charizard">
                        </div>
                        <div>
                            <button class="btn btn-success" onclick="exportImages()">
                                Export Front & Back
                            </button>
                            <small class="d-block mt-2 text-muted">Creates: [name]_front.jpg and [name]_back.jpg</small>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Status Messages -->
        <div id="statusAlert" class="alert" style="display:none; position:fixed; bottom:20px; right:20px; z-index:1000;"></div>
    </div>

    <!-- OpenCV.js for contour-based card detection -->
    <script async src="https://docs.opencv.org/4.x/opencv.js" onload="window.__cvReady = true"></script>

    <script src="app.js"></script>
</body>
</html>
