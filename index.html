<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slab Scanner - Graded Card Processor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container-fluid py-4">
        <h1 class="mb-4">Slab Scanner</h1>

        <!-- Upload Section -->
        <div class="row mb-5">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h5>Front Photo</h5>
                    </div>
                    <div class="card-body">
                        <div id="frontDropZone" class="drop-zone">
                            <p>Drag and drop front photo here</p>
                            <input type="file" id="frontInput" accept="image/*" style="display:none;">
                            <button class="btn btn-outline-primary" onclick="document.getElementById('frontInput').click()">
                                Choose Image
                            </button>
                        </div>
                        <div id="frontPreview" class="mt-3" style="display:none;">
                            <img id="frontImage" src="" alt="Front" class="img-fluid">
                            <button class="btn btn-sm btn-danger mt-2" onclick="clearImage('front')">Clear</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h5>Back Photo</h5>
                    </div>
                    <div class="card-body">
                        <div id="backDropZone" class="drop-zone">
                            <p>Drag and drop back photo here</p>
                            <input type="file" id="backInput" accept="image/*" style="display:none;">
                            <button class="btn btn-outline-primary" onclick="document.getElementById('backInput').click()">
                                Choose Image
                            </button>
                        </div>
                        <div id="backPreview" class="mt-3" style="display:none;">
                            <img id="backImage" src="" alt="Back" class="img-fluid">
                            <button class="btn btn-sm btn-danger mt-2" onclick="clearImage('back')">Clear</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Processing Section -->
        <div class="row mb-5" id="processingSection" style="display:none;">
            <div class="col-12">
                <div class="card">
                    <div class="card-header">
                        <h5>Detected Card Outlines</h5>
                    </div>
                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-6">
                                <h6>Front</h6>
                                <div id="frontCanvasContainer" class="canvas-container">
                                    <canvas id="frontCanvas"></canvas>
                                </div>
                                <div class="mt-2">
                                    <label>Buffer (px):</label>
                                    <input type="number" id="frontBuffer" value="10" min="0" class="form-control form-control-sm" onchange="reprocessImages()">
                                </div>
                            </div>
                            <div class="col-md-6">
                                <h6>Back</h6>
                                <div id="backCanvasContainer" class="canvas-container">
                                    <canvas id="backCanvas"></canvas>
                                </div>
                                <div class="mt-2">
                                    <label>Buffer (px):</label>
                                    <input type="number" id="backBuffer" value="10" min="0" class="form-control form-control-sm" onchange="reprocessImages()">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Export Section -->
        <div class="row" id="exportSection" style="display:none;">
            <div class="col-12">
                <div class="card">
                    <div class="card-header">
                        <h5>Export</h5>
                    </div>
                    <div class="card-body">
                        <div class="mb-3">
                            <label for="exportName" class="form-label">Card Name/ID:</label>
                            <input type="text" id="exportName" class="form-control" placeholder="e.g., PSA-001, Base-Charizard">
                        </div>
                        <div>
                            <button class="btn btn-success" onclick="exportImages()">
                                Export Front & Back
                            </button>
                            <small class="d-block mt-2 text-muted">Creates: [name]_front.jpg and [name]_back.jpg</small>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Status Messages -->
        <div id="statusAlert" class="alert" style="display:none; position:fixed; bottom:20px; right:20px; z-index:1000;"></div>
    </div>

    <!-- TensorFlow.js -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.11.0"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3"></script>

    <script src="app.js"></script>
</body>
</html>
