<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slab Scanner - Graded Card Processor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container-fluid py-4">
        <h1 class="mb-4">Slab Scanner</h1>

        <!-- Upload Section -->
        <div id="uploadSection" class="row mb-5">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h5 class="mb-0">Front Photo</h5>
                    </div>
                    <div class="card-body">
                        <div id="frontDropZone" class="drop-zone">
                            <img id="frontImage" class="drop-zone-thumb" alt="Front preview">
                            <div class="drop-zone-content">
                                <p class="drop-zone-prompt">Drag and drop front photo here</p>
                                <input type="file" id="frontInput" accept="image/*" style="display:none;">
                                <button class="btn btn-outline-primary btn-sm" onclick="document.getElementById('frontInput').click()">Choose Image</button>
                                <button class="btn btn-sm btn-link text-danger drop-zone-clear" onclick="clearImage('front')">Clear</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h5 class="mb-0">Back Photo</h5>
                    </div>
                    <div class="card-body">
                        <div id="backDropZone" class="drop-zone">
                            <img id="backImage" class="drop-zone-thumb" alt="Back preview">
                            <div class="drop-zone-content">
                                <p class="drop-zone-prompt">Drag and drop back photo here</p>
                                <input type="file" id="backInput" accept="image/*" style="display:none;">
                                <button class="btn btn-outline-primary btn-sm" onclick="document.getElementById('backInput').click()">Choose Image</button>
                                <button class="btn btn-sm btn-link text-danger drop-zone-clear" onclick="clearImage('back')">Clear</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Marking Section -->
        <div class="row mb-4" id="processingSection" style="display:none;">
            <div class="col-12">
                <div class="card">
                    <div class="card-header d-flex justify-content-between align-items-center flex-wrap gap-2">
                        <div>
                            <h5 class="mb-0">Mark cards on this scan</h5>
                            <small class="text-muted">Click-drag corner-to-corner on the front to mark each card. Right-click a rectangle to delete it. Adjust on the back as needed.</small>
                        </div>
                        <div class="d-flex gap-2">
                            <button class="btn btn-sm btn-outline-secondary" onclick="clearAllRects()">Clear rectangles</button>
                            <button class="btn btn-success" onclick="saveCardsFromScan()">Save cards from this scan</button>
                            <button class="btn btn-outline-primary btn-sm" onclick="nextScan()">Next scan</button>
                        </div>
                    </div>
                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-6">
                                <div class="d-flex justify-content-between align-items-center mb-2 flex-wrap gap-2">
                                    <h6 class="mb-0">Front</h6>
                                    <button class="btn btn-sm btn-outline-primary" onclick="document.getElementById('frontInput').click()">Change image</button>
                                </div>
                                <div id="frontCanvasContainer" class="canvas-container">
                                    <canvas id="frontCanvas"></canvas>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="d-flex justify-content-between align-items-center mb-2 flex-wrap gap-2">
                                    <h6 class="mb-0">Back</h6>
                                    <button class="btn btn-sm btn-outline-primary" onclick="document.getElementById('backInput').click()">Change image</button>
                                </div>
                                <div id="backCanvasContainer" class="canvas-container">
                                    <canvas id="backCanvas"></canvas>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Saved Cards Section -->
        <div class="row mb-4" id="savedSection" style="display:none;">
            <div class="col-12">
                <div class="card">
                    <div class="card-header d-flex justify-content-between align-items-center flex-wrap gap-2">
                        <h5 class="mb-0">Saved cards (<span id="savedCount">0</span>)</h5>
                        <div class="d-flex gap-2">
                            <button class="btn btn-success btn-sm" onclick="downloadAll()">Download all + CSV</button>
                            <button class="btn btn-outline-danger btn-sm" onclick="clearAllSaved()">Clear all</button>
                        </div>
                    </div>
                    <div class="card-body">
                        <div id="savedGrid" class="row g-3"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Status Messages -->
        <div id="statusAlert" class="alert" style="display:none; position:fixed; bottom:20px; right:20px; z-index:1000;"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
